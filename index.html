<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Портфолио Михаила Салькова — AI-автоматизация и продуктовый дизайн.">
<title>Михаил Сальков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&display=swap">
<style>
  /* ───────── Токены (палитра из макета, только светлая тема) ─────────
     Шрифт: Golos Text 400 / 500 · межбуквенный −2% · отступы кратны 8:
     2 / 4 / 8 / 10 / 12 / 16 / 24 / 32 / 40 / 48 / 56 / 64 / 72 / 80 / 88 / 96 … */
  :root {
    --ink: #414753;                       /* 414753 · 100% — текст, тёмные плашки */
    --ink-50: rgba(65, 71, 83, .5);       /* заголовки разделов */
    --ink-40: rgba(65, 71, 83, .4);       /* второстепенный текст, ховер-рамка */
    --ink-30: rgba(65, 71, 83, .3);       /* подпись на серой плашке «скоро кейс» */
    --ink-20: rgba(65, 71, 83, .2);       /* неактивные точки, разделитель */
    --ink-10: rgba(65, 71, 83, .1);       /* рамки кнопок */
    --bg: #ffffff;                        /* FFFFFF · 100% */
    --panel: #f5f5f5;                     /* F5F5F5 · 100% — карточки, слайдер */
    --cta: #1a9b3a;                       /* 1A9B3A · 100% — «Связаться» */
    --cta-hover: #147c2e;
    --font: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --col: 800px;                         /* ширина колонки контента */
    --side: 24px;                         /* боковое поле */
    color-scheme: light;
  }

  /* ───────── База ───────── */
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.2 var(--font);
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .app { min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap { width: min(var(--col), 100% - var(--side) * 2); margin-inline: auto; }
  #main { flex: 1; display: flex; flex-direction: column; }
  svg { display: block; }

  /* ───────── Шапка (одинаковая на всех страницах) ───────── */
  .top { padding-top: 24px; }
  .bar { height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { min-width: 0; font-weight: 500; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

  /* ───────── Кнопки (UI-кит) ───────── */
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 32px; padding: 0 13.5px;   /* + рамка 1px ≈ 14 от края, как в макете */
    border: 1px solid var(--ink-10); border-radius: 999px;
    background: var(--bg); color: var(--ink);
    font: 500 16px/1.2 var(--font); letter-spacing: -0.02em;
    text-decoration: none; white-space: nowrap; cursor: pointer;
    transition: border-color .2s, background-color .2s;
  }
  .pill:hover { border-color: var(--ink-40); }
  .pill--cta, .pill--cta:hover { border-color: transparent; }
  .pill--cta { background: var(--cta); color: #ffffff; }
  .pill--cta:hover { background: var(--cta-hover); }
  .pill--hh { padding-left: 8px; }
  .pill--nav { gap: 10px; }
  .pill--nav.next { padding-inline: 16px; }
  .ico { display: inline-flex; }
  .hh {
    display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
    background: #d20d15; color: #fff; font: 700 8px/1 var(--font); letter-spacing: -0.04em;
  }

  /* ───────── Анимация появления вида ───────── */
  .view { animation: enter .4s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  /* ───────── Главная: карусель ───────── */
  #home { flex: 1; display: flex; align-items: center; padding-block: 96px; }
  .rail {
    --gutter: max(var(--side), calc((100% - var(--col)) / 2));
    flex: 1; min-width: 0;
    display: flex; align-items: flex-start; gap: 12px;
    padding-inline: var(--gutter) var(--side);
    overflow-x: auto; overscroll-behavior-x: contain;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    user-select: none; cursor: grab;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail.dragging { cursor: grabbing; }
  @media (pointer: coarse) {
    .rail { scroll-snap-type: x proximity; scroll-padding-inline: var(--gutter); }
    .rail > * { scroll-snap-align: start; }
  }

  .intro { flex: 0 0 350px; width: 350px; margin-right: 12px; }      /* 12 + gap 12 = 24 до первой карточки */
  .intro img { display: block; width: 100%; height: 385px; object-fit: cover; -webkit-user-drag: none; }
  .intro p { margin: 10px 0 0; font-weight: 500; }

  .card {
    position: relative; display: block; flex: 0 0 350px; width: 350px; height: 450px;
    overflow: hidden; isolation: isolate; color: #fff; text-decoration: none;
    background: var(--tint, #6f7480);
  }
  .card img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transition: transform .7s cubic-bezier(.2, .7, .2, 1); -webkit-user-drag: none;
  }
  .card::after {                                                       /* градиент под названием */
    content: ""; position: absolute; inset: auto 0 0 0; height: var(--sh-h, 102px); z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, var(--sh-0, rgba(0, 0, 0, 0)), var(--sh-1, rgba(0, 0, 0, .62)));
  }
  .card:hover img { transform: scale(1.04); }                          /* при наведении на карточку растёт только картинка */
  .card__title { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: 20px; font-weight: 500; }
  .card__title .ln { display: block; }
  .card__go {                                                          /* кнопка-стрелка: ×2 при наведении на карточку */
    position: absolute; z-index: 2; top: 20px; right: 20px;
    width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: 50%; background: #fff; color: var(--ink);
    transform-origin: 100% 0; transition: transform .25s cubic-bezier(.2, .7, .2, 1);
  }
  .card:hover .card__go, .card:focus-visible .card__go { transform: scale(2); }

  /* серая плашка «скоро тут появится новый кейс» — без ховера и действий, уже карточки */
  .soon {
    flex: 0 0 231px; width: 231px; height: 450px; padding-top: 9px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: var(--panel); color: var(--ink-30); text-align: center; font-weight: 500;
  }
  .soon__plus { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; background: var(--ink-10); color: var(--panel); }
  .soon p { margin: 0; max-width: 170px; }

  /* ───────── Страница кейса ───────── */
  #case { padding: 100px 0 96px; }
  .hero { margin: 48px 0 0; aspect-ratio: 2 / 1; background: var(--panel); }
  .hero img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .prose > .lead { margin: 24px 0 0; font: 500 24px/1.2 var(--font); }

  .meta { margin: 24px 0 0; display: flex; flex-wrap: wrap; gap: 10px 8px; }
  .meta__i { display: inline-flex; gap: 8px; }
  .meta__i span { color: var(--ink-40); }
  .meta__i:not(:last-child)::after { content: "\2022"; color: var(--ink-20); }

  .cards { margin: 56px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cc { padding: 20px; min-height: 280px; background: var(--panel); }
  .cc small { display: block; font-size: 14px; color: var(--ink-40); }
  .cc p { margin: 16px 0 0; }
  .cc--dark { background: var(--ink); color: #fff; }
  .cc--dark small { color: rgba(255, 255, 255, .4); }

  .sec { margin-top: 56px; }
  .sec > h2 { margin: 0; font: 500 20px/1.2 var(--font); color: var(--ink-50); }
  .sec > p { margin: 24px 0 0; }
  .sec > p + p { margin-top: 1.2em; }
  .sec > .tags { margin-top: 16px; color: var(--ink-40); }

  .stages { margin: 24px 0 0; }
  .stage { padding: 16px 0; border-top: 1px solid var(--ink-10); }
  .stage__head { display: flex; justify-content: space-between; gap: 12px; }
  .stage__head b { font-weight: 500; }
  .stage__head span, .stage p { color: var(--ink-40); }
  .stage p { margin: 8px 0 0; }

  .swatches { margin: 24px 0 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; align-items: flex-end; height: 96px; padding: 12px; color: #fff; font-size: 12px; }
  .sw--light { color: var(--ink); }
  .sw--line { box-shadow: inset 0 0 0 1px var(--ink-10); }

  /* слайдер */
  .sl { margin-top: 24px; }
  .slider { position: relative; background: var(--panel); }
  .slider__track {
    display: flex; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .slider__track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; aspect-ratio: 2 / 1; scroll-snap-align: start; scroll-snap-stop: always; }
  .slide img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .slide--contain img { object-fit: contain; }
  .slider__btn {
    position: absolute; top: 50%; margin-top: -16px; z-index: 2;
    width: 32px; height: 32px; padding: 0; display: grid; place-items: center;
    border: 1px solid var(--ink-10); border-radius: 50%; background: var(--panel); color: var(--ink);
    cursor: pointer; transition: border-color .2s;
  }
  .slider__btn:hover { border-color: var(--ink-40); }
  .slider__btn--prev { left: 20px; }
  .slider__btn--next { right: 20px; }
  .slider__dots { position: absolute; left: 50%; bottom: 20px; z-index: 2; display: flex; gap: 4px; transform: translateX(-50%); }
  .slider__dot { position: relative; width: 4px; height: 4px; padding: 0; border: 0; border-radius: 50%; background: var(--ink-20); cursor: pointer; }
  .slider__dot::before { content: ""; position: absolute; inset: -8px -2px; }
  .slider__dot[aria-current="true"] { background: var(--ink); }
  .slider--shot .slide { aspect-ratio: 1516 / 800; }                    /* скриншоты: показываем целиком, без обрезки */
  .slider--light .slider__btn { background: transparent; border-color: rgba(255, 255, 255, .2); color: #fff; }
  .slider--light .slider__btn:hover { border-color: rgba(255, 255, 255, .5); }
  .slider--light .slider__dot { background: rgba(255, 255, 255, .4); }
  .slider--light .slider__dot[aria-current="true"] { background: #fff; }

  /* подпись под слайдом: все подписи лежат в одной ячейке, чтобы высота блока не прыгала при листании */
  .sl__caps { display: grid; margin-top: 10px; font-size: 14px; color: var(--ink-40); }
  .sl__cap { grid-area: 1 / 1; margin: 0; visibility: hidden; }
  .sl__cap[data-on] { visibility: visible; }

  /* раздел в рамке / на тёмной плашке */
  .sec--box, .sec--dark { padding: 20px; border: 1px solid var(--ink-10); }
  .sec--dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .sec--dark > h2 { color: #a0a3a9; }
  .sec--dark .sl__caps { color: rgba(255, 255, 255, .4); }

  /* нумерованные строки: «№N + название | описание» */
  .steps { list-style: none; margin: 3px 0 0; padding: 0; }
  .sec--box > .steps { margin-top: 20px; }
  .step { display: grid; grid-template-columns: 200px 1fr; column-gap: 24px; padding: 22px 0; }
  .step + .step { border-top: 1px solid var(--ink-10); }
  .sec:not(.sec--box) > .steps .step:last-child { padding-bottom: 0; }
  .step__k { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; color: var(--ink-50); }
  .step__n { display: grid; place-items: center; min-width: 48px; height: 26px; padding: 0 14px; border-radius: 999px; background: var(--panel); font-size: 14px; }
  .step__t { margin: 0; align-self: start; }
  .step__k .ln { display: block; }                                      /* строки названия — как в макете; на мобильном перетекают в одну */

  /* отзыв */
  .quote { margin: 24px 0 0; }
  .quote blockquote { position: relative; margin: 0; font: 500 24px/1.2 var(--font); }
  .quote blockquote::before {
    content: "\201C"; position: absolute; right: 100%; top: -4px; margin-right: 16px;
    color: var(--ink-20); font: italic 500 64px/1 Georgia, serif; letter-spacing: 0;
  }
  .quote figcaption { display: flex; align-items: center; gap: 16px; margin-top: 24px; }
  .quote img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
  .quote .av { flex: none; width: 42px; height: 42px; margin: 0; display: grid; place-items: center; border-radius: 50%; background: #ff2700; color: #fff; font-size: 12px; font-weight: 500; }
  .quote b { display: block; font-weight: 500; }
  .quote span { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-40); }

  .stats { margin-top: 48px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { display: flex; flex-direction: column; min-height: 250px; padding: 20px; background: var(--panel); }
  .stat b { font: 500 32px/32px var(--font); }
  .stat p { margin: 18px 0 0; }
  .stat small { margin-top: auto; padding-top: 16px; font-size: 12px; color: var(--ink-40); }

  /* «предыдущий / следующий» — липкая панель: стоит внизу окна, пока не дойдёт до конца статьи */
  .pager {
    position: sticky; bottom: 24px; z-index: 10; margin-top: 48px;
    display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
  }
  .pager .pill { pointer-events: auto; }

  .missing { margin: 48px 0 0; font: 500 24px/1.2 var(--font); }

  /* ───────── Подвал ───────── */
  .foot { padding: 0 var(--side) 22px; text-align: center; color: var(--ink-40); font-size: 12px; }

  /* ───────── Мобильная версия ───────── */
  @media (max-width: 640px) {
    .pill--hh { width: 32px; padding: 0; }
    .pill--hh .lbl { display: none; }

    #home { align-items: flex-start; padding-block: 100px; }
    .rail { flex-direction: column; align-items: stretch; gap: 12px; overflow: visible; cursor: auto; user-select: auto; }
    .intro { flex: none; width: auto; margin: 0 0 10px; }
    .intro img { height: auto; aspect-ratio: 354 / 350; }
    .card { flex: none; width: auto; height: auto; aspect-ratio: 354 / 350; }
    .card img { object-position: 50% 0; }                                /* обложка 700×900 в кадре 354×350 — от верха, как в макете */
    .soon { flex: none; width: auto; height: 200px; gap: 14px; }

    .hero { aspect-ratio: 354 / 350; }
    .cards, .stats { grid-template-columns: 1fr; }
    .cc { min-height: 0; padding-bottom: 36px; }
    .stat { min-height: 216px; }
    .slide { aspect-ratio: 354 / 350; }
    .swatches { grid-template-columns: repeat(2, 1fr); }
    .quote blockquote::before { display: none; }
    .step { grid-template-columns: 1fr; row-gap: 12px; }
    .step__k { flex-direction: row; justify-content: flex-start; gap: 12px; text-align: left; }
    .step__t { align-self: auto; }
    .step__k .ln { display: inline; }

    .pager .pill--nav { width: 32px; padding: 0; }
    .pager .pill--nav .txt { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .view { animation: none; }
    .card img, .card__go { transition: none; }
    .slider__track { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="#/" id="name"></a>
      <nav class="actions" aria-label="Контакты">
        <a class="pill pill--hh" id="resume" target="_blank" rel="noopener" aria-label="Резюме на hh"><span class="hh" aria-hidden="true">hh</span><span class="lbl">Резюме на hh</span></a>
        <a class="pill pill--cta" id="contact" target="_blank" rel="noopener">Связаться</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="home" class="view" aria-label="Кейсы">
      <div class="rail" id="rail" role="region" aria-label="Карусель кейсов"></div>
    </section>
    <section id="case" class="view" hidden></section>
  </main>

  <footer class="foot" id="legal"></footer>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   НАСТРОЙКИ — правьте здесь: ссылки, тексты и список кейсов.
   ════════════════════════════════════════════════════════════════ */
const SITE = {
  name:    'Михаил Сальков',
  intro:   'Добро пожаловать! Меня зовут Михаил, я специалист по AI-автоматизации с опытом более 8-ми лет в продуктовом дизайне',
  resume:  'https://drive.google.com/file/d/1J5dM7pwmTNrciYsIWsoxMNE4NX0itflU/view?usp=sharing',   // ← кнопка «Резюме на hh»
  contact: 'https://t.me/ma_salkov',         // ← кнопка «Связаться»
  soon:    'Скоро тут появится новый кейс',  // ← серая плашка в конце карусели; пустая строка — плашки не будет
  legal:   'ИП Сальков Михаил Александрович, ИНН: 772916478709',
  portrait:'img/portrait.jpg'
};

/* ────────────────────────────────────────────────────────────────
   Кейсы. Порядок в массиве = порядок в карусели и в кнопках «предыдущий / следующий».
   Страница кейса собирается по шаблону из макета:
     slug, title, cover, tint   — адрес, название и обложка карточки (если обложки нет — цвет tint)
     lines [строки]?            — название на карточке с заданными переносами строк (иначе переносится само)
     shade {h, rgb, a}?         — затемнение под названием на карточке (по умолчанию чёрный 0→62% на 102px)
     hero   {d, m?, alt}        — большая картинка 2:1 (m — вариант для мобильной версии)
     lead                       — крупный вводный абзац
     meta   [[название, значение], …]   — строка «Категория · Тип · Платформа · Период»
     cards  [{label, text, dark?}, …]   — три карточки под вводным абзацем
     sections [{title, paras[], tags?, stages?, swatches?, slides?}]   — разделы
         slides [{src, alt, caption?, contain?}]  — слайдер под текстом раздела (без src — пустой слот);
                caption — подпись под слайдом (для нового кейса берётся из названия файла картинки)
         steps  [{name, text}]      — нумерованные строки «№N Название | описание»
         box / dark: true           — раздел в рамке / на тёмной плашке
         slider {light?, shot?}     — светлые стрелки и точки (для ярких картинок) / показывать картинку целиком (2:1 → 1516×800)
     quote  {text, name, role, avatar | initials}  — отзыв (раздел «Результат»); initials — буквы в цветном круге вместо фото
     stats  [{n, text, src}, …]         — три карточки с цифрами
   ──────────────────────────────────────────────────────────────── */
const CASES = [
  {
    slug: 'ai-administrator',
    title: 'AI-администратор, который круглосуточно консультирует клиентов по услугам салона и помогает перейти к онлайн-записи',
    lines: ['AI-администратор, который', 'круглосуточно консультирует', 'клиентов по услугам салона', 'и помогает перейти к онлайн-записи'],   // переносы строк в карточке — как в макете
    cover: 'img/cover-ai.jpg', tint: '#f2400a', shade: { h: 190, rgb: '30, 30, 30', a: 1 },   // длинное название — затемнение выше и плотнее, как в макете обложки
    hero: { d: 'img/hero-ai.jpg', alt: 'Telegram-бот салона: консультация по стоимости маникюра' },
    lead: 'AI-администратор, который круглосуточно консультирует клиентов по услугам салона и помогает перейти к онлайн-записи',
    meta: [['Категория', 'B2B / Beauty'], ['Тип', 'AI-ассистент'], ['Период', '2025']],

const $ = (s) => document.querySelector(s);
const svg = (d, s) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const ICON = {
  ur: svg('<path d="M7 7h10v10"/><path d="M7 17 17 7"/>', 16),
  l:  svg('<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>', 20),
  r:  svg('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>', 20)
};
/* h(тег, свойства, …дети). css:{…} — стили через CSSOM */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'css') for (const [p, val] of Object.entries(v)) el.style.setProperty(p, val);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid);
  return el;
}
const ico = (name) => h('span', { class: 'ico', html: ICON[name] });
const plainClick = (e) => e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey;
const img = (src, alt) => h('img', { src, alt: alt || '' });

const shade = (o) => o ? { '--sh-h': o.h + 'px', '--sh-0': 'rgba(' + o.rgb + ', 0)', '--sh-1': 'rgba(' + o.rgb + ', ' + o.a + ')' } : {};

/* Перетаскивание мышью, колесо → горизонтальная прокрутка, стрелки клавиатуры */
let dragging = false, startX = 0, startLeft = 0, moved = 0;
rail.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  dragging = true; moved = 0; startX = e.clientX; startLeft = rail.scrollLeft;
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx));
  if (moved > 4) { rail.classList.add('dragging'); rail.scrollLeft = startLeft - dx; }
});
window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false; rail.classList.remove('dragging');
  setTimeout(() => { moved = 0; }, 0);
});
rail.addEventListener('click', (e) => { if (moved > 4) { e.preventDefault(); e.stopPropagation(); } }, true);
rail.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  const max = rail.scrollWidth - rail.clientWidth;
  if (max <= 0) return;
  if ((e.deltaY > 0 && rail.scrollLeft < max - 1) || (e.deltaY < 0 && rail.scrollLeft > 0)) {
    e.preventDefault(); rail.scrollLeft += e.deltaY;
  }
}, { passive: false });

/* ── Слайдер: стрелки, точки, свайп (scroll-snap) ── */
function slider(slides, label, opt = {}) {
  const n = slides.length;
  const track = h('div', { class: 'slider__track', tabindex: '0', role: 'group', 'aria-label': label },
    slides.map((s, i) => h('div', { class: 'slide' + (s.contain ? ' slide--contain' : ''), role: 'group', 'aria-roledescription': 'slide', 'aria-label': (i + 1) + ' из ' + n },
      s.src ? img(s.src, s.alt) : null)));
  const dots = slides.map((_, i) => h('button', { class: 'slider__dot', type: 'button', 'aria-label': 'Слайд ' + (i + 1) }));
  const caps = slides.map((sl) => h('p', { class: 'sl__cap', text: sl.caption || '' }));      // подписи под слайдами
  let target = null;                                   // слайд, к которому едем по клику (пока идёт анимация)
  const width = () => Math.max(1, track.clientWidth);
  const cur = () => target != null ? target : Math.round(track.scrollLeft / width());
  const mark = () => {
    const c = cur();
    dots.forEach((d, i) => d.setAttribute('aria-current', i === c ? 'true' : 'false'));
    caps.forEach((p, i) => p.toggleAttribute('data-on', i === c));
  };
  const go = (i) => {
    target = ((i % n) + n) % n;
    mark();
    track.scrollTo({ left: target * width(), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  };
  const prev = h('button', { class: 'slider__btn slider__btn--prev', type: 'button', 'aria-label': 'Предыдущий слайд', html: ICON.l });
  const next = h('button', { class: 'slider__btn slider__btn--next', type: 'button', 'aria-label': 'Следующий слайд', html: ICON.r });
  prev.addEventListener('click', () => go(cur() - 1));
  next.addEventListener('click', () => go(cur() + 1));
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
  track.addEventListener('scroll', () => {
    if (target != null && Math.abs(track.scrollLeft - target * width()) < 2) target = null;
    mark();
  }, { passive: true });
  ['pointerdown', 'wheel', 'touchstart'].forEach((ev) => track.addEventListener(ev, () => { target = null; }, { passive: true }));
  track.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(cur() + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur() - 1); }
  });
  mark();
  const box = h('div', { class: 'slider' + (opt.light ? ' slider--light' : '') + (opt.shot ? ' slider--shot' : ''), role: 'region', 'aria-roledescription': 'carousel', 'aria-label': label },
    track, prev, next, h('div', { class: 'slider__dots' }, dots));
  const hasCaps = slides.some((sl) => sl.caption);
  return h('div', { class: 'sl' }, box, hasCaps ? h('div', { class: 'sl__caps', 'aria-live': 'polite' }, caps) : null);
}

function renderCase(i) {
  const c = CASES[i], n = CASES.length;
  const article = h('article', { class: 'prose' },
    h('h1', { class: 'sr-only', text: c.title }),
    hero(c),
    h('p', { class: 'lead', text: c.lead }),
    meta(c.meta), cards(c.cards),
    c.sections.map(section),
    c.quote ? resultSection(c.quote) : null,
    c.stats ? stats(c.stats) : null);
  caseView.replaceChildren(h('div', { class: 'wrap' }, backLink(), article,
    n > 1 ? h('nav', { class: 'pager', 'aria-label': 'Другие кейсы' }, pagerLink((i - 1 + n) % n, 'prev'), pagerLink((i + 1) % n, 'next')) : null));
  document.title = c.title + ' — ' + SITE.name;
}

function renderMissing() {
  caseView.replaceChildren(h('div', { class: 'wrap' }, backLink(), h('p', { class: 'missing', text: 'Такого кейса нет' })));
  document.title = SITE.name;
}

/* Клики: «Все кейсы» и «предыдущий / следующий» */
document.addEventListener('click', (e) => {
  const a = e.target.closest('#back, [data-go]');
  if (!a || !plainClick(e)) return;
  e.preventDefault();
  if (a.id === 'back') {
    if (enteredFromHome) history.back(); else location.hash = '#/';
  } else {
    replacing = true;                       // не засоряем историю: «Назад» браузера ведёт на главную
    location.replace(a.getAttribute('href'));
  }
});

/* ── Маршрутизация: #/ — главная, #/case/<slug> — кейс ── */
let prevRoute = null, enteredFromHome = false, replacing = false, savedScroll = 0, lastSlug = null, currentIndex = -1;
function replay(el) { el.classList.remove('view'); void el.offsetWidth; el.classList.add('view'); }

function route() {
  const m = location.hash.match(/^#\/case\/([^/?#]+)/);
  const name = m ? 'case' : 'home';
  if (prevRoute === 'home') savedScroll = rail.scrollLeft;

  document.body.dataset.view = name;
  if (name === 'case') {
    const slug = decodeURIComponent(m[1]);
    const i = CASES.findIndex((c) => c.slug === slug);
    if (!replacing) enteredFromHome = prevRoute === 'home' ? true : (prevRoute === null ? false : enteredFromHome);
    if (i >= 0) { renderCase(i); lastSlug = slug; currentIndex = i; } else { renderMissing(); currentIndex = -1; }
    homeView.hidden = true; caseView.hidden = false;
    replay(caseView);
    window.scrollTo(0, 0);
  } else {
    homeView.hidden = false; caseView.hidden = true;
    rail.scrollLeft = savedScroll;
    if (lastSlug) {                         // вернулись — показываем карточку, из которой ушли
      const card = rail.querySelector('[data-slug="' + CSS.escape(lastSlug) + '"]');
      if (card && rail.scrollWidth > rail.clientWidth) {
        const rb = rail.getBoundingClientRect(), cb = card.getBoundingClientRect();
        if (cb.right > rb.right - 24) rail.scrollLeft += cb.right - rb.right + 24;
        else if (cb.left < rb.left + 24) rail.scrollLeft += cb.left - rb.left - 24;
      }
    }
    document.title = SITE.name;
    replay(homeView);
  }
  prevRoute = name; replacing = false;
}
window.addEventListener('hashchange', route);
route();

/* ── Клавиатура ── */
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.target.closest && e.target.closest('.slider')) return;   // стрелки внутри слайдера листают слайды
  if (prevRoute === 'case') {
    if (e.key === 'ArrowRight' && currentIndex >= 0) caseView.querySelector('[data-go="next"]')?.click();
    else if (e.key === 'ArrowLeft' && currentIndex >= 0) caseView.querySelector('[data-go="prev"]')?.click();
    else if (e.key === 'Escape') caseView.querySelector('#back')?.click();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    rail.scrollBy({ left: (e.key === 'ArrowRight' ? 1 : -1) * (350 + 12), behavior: 'smooth' });
  }
});
</script>
</body>
</html>
